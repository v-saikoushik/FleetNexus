name: fleetnexus

# ─────────────────────────────────────────────────────────────
#  Local infrastructure for FleetNexus development.
#  Start everything:  pnpm docker:up
#  Stop everything:   pnpm docker:down
#  View postgres logs: pnpm docker:logs
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fleetnexus-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetnexus}
      POSTGRES_DB: ${POSTGRES_DB:-fleetnexus}
    volumes:
      - fleetnexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fleetnexus

  # ── pgAdmin (optional GUI — http://localhost:5050) ──────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fleetnexus-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fleetnexus.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - fleetnexus_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleetnexus

# ── Redis (placeholder — uncomment when needed) ──────────────
# redis:
#   image: redis:7-alpine
#   container_name: fleetnexus-redis
#   restart: unless-stopped
#   ports:
#     - '${REDIS_PORT:-6379}:6379'
#   volumes:
#     - fleetnexus_redis_data:/data
#   networks:
#     - fleetnexus

networks:
  fleetnexus:
    driver: bridge

volumes:
  fleetnexus_postgres_data:
  fleetnexus_pgadmin_data:
  # fleetnexus_redis_data:
