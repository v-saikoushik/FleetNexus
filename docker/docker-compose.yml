services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetnexus-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetnexus}
      POSTGRES_DB: ${POSTGRES_DB:-fleetnexus}
    volumes:
      - fleetnexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fleetnexus} -d ${POSTGRES_DB:-fleetnexus}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fleetnexus_postgres_data:
